name: Paired eval

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/paired-eval/**"
      - "packages/core/src/paired-eval/**"
      - "packages/cli/src/paired-eval/**"
      - ".github/workflows/paired-eval.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-and-run-script:
    name: Analysis and run script
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scripts/paired-eval/requirements.txt

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          pip install -r scripts/paired-eval/requirements.txt

      - name: Build CLI
        run: pnpm build

      - name: Python tests (synthetic data, baseline end to end)
        env:
          EUCONFORM_CLI: node packages/cli/dist/index.js
        run: python -m pytest -q scripts/paired-eval/tests

      - name: Label token tests
        run: node --test scripts/paired-eval/tests/choose-label-tokens.test.mjs

      - name: Simulate run-p0-pilot.sh with a fake model runner
        env:
          REAL_CLI: node ${{ github.workspace }}/packages/cli/dist/index.js
          PY: python
        run: bash scripts/paired-eval/tests/sim-run-p0-pilot.sh
