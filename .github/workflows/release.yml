name: Release

on:
  push:
    branches: [main]
  # Allows re-running a failed publish without pushing an empty commit, e.g. after
  # rotating NPM_TOKEN. A dispatch run publishes any version already bumped on main.
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          # Configure the registry explicitly: npm/pnpm read the auth token from the
          # project .npmrc that setup-node writes, with NODE_AUTH_TOKEN expanded from
          # the environment at publish time.
          registry-url: "https://registry.npmjs.org"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Create Release Pull Request or Publish
        id: changesets
        # v1 on purpose: changesets/action v2 requires Changesets CLI v3, and this
        # repo is still on @changesets/cli v2. Moving to v2 needs a separate CLI
        # major upgrade; until then v1 is the compatible release.
        uses: changesets/action@v1
        with:
          publish: pnpm ci:publish
          commit: "chore: release"
          title: "chore: release"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Both names on purpose: the action's own .npmrc handling reads NPM_TOKEN,
          # while setup-node's registry config and pnpm/npm expand NODE_AUTH_TOKEN.
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
